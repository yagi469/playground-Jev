name: YouTube Video to Blog Post

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube動画のURL (例: https://www.youtube.com/watch?v=mIpgA0QD7ys)'
        required: true
        type: string
      focus:
        description: 'フォーカスするセクション・テーマ・講演者 (任意)'
        required: false
        default: ''
        type: string
      time:
        description: '対象時間帯 (例: 15:30-45:00) (任意)'
        required: false
        default: ''
        type: string
      start:
        description: '開始時間 (例: 15:30) (任意)'
        required: false
        default: ''
        type: string
      end:
        description: '終了時間 (例: 45:00) (任意)'
        required: false
        default: ''
        type: string
      max_revisions:
        description: 'Jev×Geminiの推敲リライト上限回数'
        required: false
        default: '2'
        type: string

  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout playground-Jev
        uses: actions/checkout@v4

      - name: Checkout yagibrary
        uses: actions/checkout@v4
        with:
          repository: yagi469/yagibrary
          token: ${{ secrets.GH_PAT }}
          path: yagibrary

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install uv and nlm CLI
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/uv tool install notebooklm-mcp-cli

      - name: Setup NotebookLM Auth Cookies
        env:
          NOTEBOOKLM_COOKIES: ${{ secrets.NOTEBOOKLM_COOKIES }}
        run: |
          if [ -z "$NOTEBOOKLM_COOKIES" ]; then
            echo "❌ Error: NOTEBOOKLM_COOKIES secret is not set!"
            echo "Please set NOTEBOOKLM_COOKIES in repository Secrets."
            exit 1
          fi
          mkdir -p ~/.notebooklm-mcp-cli/profiles/default
          echo "$NOTEBOOKLM_COOKIES" > ~/.notebooklm-mcp-cli/profiles/default/cookies.json
          echo "✓ NotebookLM cookies configured."

      - name: Run YouTube to Blog Pipeline
        id: blogger
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          OUTPUT_DIR="${{ github.workspace }}/yagibrary/src/content/posts"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🚀 Running from workflow_dispatch..."
            CMD_ARGS=(
              "${{ github.event.inputs.youtube_url }}"
              --output-dir "$OUTPUT_DIR"
              --max-revisions "${{ github.event.inputs.max_revisions || '2' }}"
            )
            if [ -n "${{ github.event.inputs.focus }}" ]; then
              CMD_ARGS+=(--focus "${{ github.event.inputs.focus }}")
            fi
            if [ -n "${{ github.event.inputs.time }}" ]; then
              CMD_ARGS+=(--time "${{ github.event.inputs.time }}")
            fi
            if [ -n "${{ github.event.inputs.start }}" ]; then
              CMD_ARGS+=(--start "${{ github.event.inputs.start }}")
            fi
            if [ -n "${{ github.event.inputs.end }}" ]; then
              CMD_ARGS+=(--end "${{ github.event.inputs.end }}")
            fi

            python youtube_to_blog.py "${CMD_ARGS[@]}"

          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "📩 Running from Issue #${{ github.event.issue.number }}..."
            ISSUE_TITLE="${{ github.event.issue.title }}"
            ISSUE_BODY="${{ github.event.issue.body }}"
            COMBINED_TEXT="${ISSUE_TITLE}\n${ISSUE_BODY}"

            # YouTube URL が含まれているかチェック
            if ! echo "$COMBINED_TEXT" | grep -Eq 'https?://(www\.)?(youtube\.com|youtu\.be)'; then
              echo "ℹ️ No YouTube URL found in issue. Skipping."
              exit 0
            fi

            python youtube_to_blog.py --from-text "$COMBINED_TEXT" --output-dir "$OUTPUT_DIR"
          fi

      - name: Commit and push changes to yagibrary
        id: commit_push
        working-directory: yagibrary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          git status
          if [ -n "$(git status --porcelain src/content/posts)" ]; then
            POST_FILE=$(git status --porcelain src/content/posts | head -n 1 | cut -c4- | tr -d '"')
            POST_BASENAME=$(basename "$POST_FILE")
            git add src/content/posts
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "post(youtube): auto-generate blog article for ${TODAY} (${POST_BASENAME})"
            git pull --rebase origin master
            git push origin master
            echo "✅ Successfully pushed new YouTube article to yagibrary!"
            echo "post_basename=$POST_BASENAME" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ No new articles were generated to commit."
          fi

      - name: Comment and close issue (Issue Ops)
        if: github.event_name == 'issues' && steps.commit_push.outputs.post_basename != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          POST_BASENAME: ${{ steps.commit_push.outputs.post_basename }}
        run: |
          SLUG=$(echo "${POST_BASENAME}" | sed 's/\.md$//')
          ARTICLE_URL="https://yagibrary.com/posts/${SLUG}/"

          COMMENT=$(printf '## 🎬 ブログ記事の自動生成が完了しました！\n\n- **記事ファイル**: `%s`\n- **公開URL**: %s\n\nTypeSafe Jev による多面品質診断と Gemini による自律推敲を経て、リポジトリ `yagibrary` に自動コミット＆プッシュされました。\n' "$POST_BASENAME" "$ARTICLE_URL")

          gh issue comment "$ISSUE_NUMBER" --body "$COMMENT"
          gh issue close "$ISSUE_NUMBER" --reason "completed"
          echo "✓ Issue #$ISSUE_NUMBER has been updated and closed."
